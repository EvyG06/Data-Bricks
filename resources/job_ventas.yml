resources:
  jobs:
    job_ventas:
      name: job_ventas_evelyn
      max_concurrent_runs: 1
      tasks:
        - task_key: cargar_ventas
          notebook_task:
            notebook_path: ../src/01_cargar_ventas.py
            base_parameters:
              catalogo: ${var.catalogo}
              esquema: ${var.esquema}

        - task_key: transformar_ventas
          depends_on:
            - task_key: cargar_ventas
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../src/02_transformar_ventas.py
            base_parameters:
              catalogo: ${var.catalogo}
              esquema: ${var.esquema}
